# WORKORDER: a creative-constraint generator for music production, from workorder.html (tools/export.js,
# tools/gen_c.py). The roll, the whole rule pool, game modes, the Run, library, scores, glossary, and a
# four-track sketch (drums, bass, chords, lead) in the ticket's key, tempo, meter and chords, with MIDI out.
name = WORKORDER
version = 1
# floats in the general registers: the weights and the scoring, and the sketch's voices in the audio interrupt
cflags = -mcpu=r3 -mfprev1 -ffp-contract=off
